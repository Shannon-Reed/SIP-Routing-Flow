
services:
  routing-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    restart: unless-stopped

  analytics-api:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      - routing-api
    restart: unless-stopped
